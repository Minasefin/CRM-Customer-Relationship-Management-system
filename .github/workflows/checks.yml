# Runs on every pull request and every push to main.
# A red X on a pull request means something below failed; open the check to see why.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: No secrets in the code
        run: npm run check:secrets
      - name: No known high or critical vulnerabilities in packages
        run: npm audit --audit-level=high
      - name: App builds
        run: npm run build
      - name: Database tests
        run: node --test database/database.test.cjs
      - name: Authentication tests
        run: npm run test:auth
