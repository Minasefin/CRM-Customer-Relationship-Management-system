# Starts the real desktop app on the real encrypted database and clicks through it
# (tests/e2e-database.mjs). Uses a random throwaway key; no real data is involved.
name: App test (database)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npm install --no-save playwright-core@1.63.0
      - name: Build the database module for Electron
        run: npx electron-rebuild --force --only better-sqlite3-multiple-ciphers
      - name: Let Electron's sandbox run on this machine
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build the app
        run: npm run build
      - name: Click through the app
        run: xvfb-run -a node tests/e2e-database.mjs
