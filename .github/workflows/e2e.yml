# Starts the real desktop app on the real encrypted database and clicks through it
# (tests/e2e-database.mjs). Uses a random throwaway key; no real data is involved.
name: App test (database)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npm install --no-save playwright-core@1.63.0
      - name: Let Electron's sandbox run on this machine
        # Chromium's sandbox needs a setuid helper on Linux runners. If this runner won't
        # allow it, fall back to running the test without it (test machine only; the app
        # itself is unchanged).
        run: |
          set -x
          ls -la node_modules/electron/dist/chrome-sandbox || true
          if sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox; then
            echo "sandbox helper ready"
          else
            echo "::warning::Could not set up the sandbox helper; running the test without Chromium's sandbox"
            echo "ELECTRON_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build the app
        run: npm run build
      - name: Click through the app
        run: xvfb-run -a node tests/e2e-database.mjs
      - name: Password screens in the real app
        run: xvfb-run -a node tests/e2e-login.mjs
      - name: Authentication in the real app
        run: xvfb-run -a npm run test:auth:electron
