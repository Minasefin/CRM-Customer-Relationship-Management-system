# Builds the installers: Mac .dmg, Windows Setup .exe, Linux .AppImage.
#   npm run dist        (installer for the computer you're on)
# The GitHub "Installers" workflow builds all three.
appId: edu.tntech.contractorcrm
productName: Contractor CRM
copyright: Mina, Adrian and Nic
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - database/index.cjs
  - database/schema.sql
  - auth/index.cjs
  - auth/password-policy.cjs
  - auth/blocked-passwords.sha256
  - auth/BLOCKLIST-LICENSE.txt
  - package.json
  # The database module ships ready-made compiled files for every system; keep only
  # this system's (${platform} = darwin, win32 or linux) and drop its source code.
  - '!node_modules/better-sqlite3-multiple-ciphers/{src,deps}/**'
  - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/!(${platform}-*).node'
  - '!node_modules/better-sqlite3-multiple-ciphers/binding.gyp'
# The encrypted database is a compiled module; it can't run from inside the app archive.
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**/*
asar: true
# Keep only English for Chromium's built-in text (dialogs, spell check menus).
# The app itself is English; the other ~50 languages are dead weight.
electronLanguages: [en, en-US, en-GB]
# The database module ships ready-made compiled files that work in Electron, so skip
# compiling it (no C++ tools needed to build the installers).
npmRebuild: false

# Security switches baked into the app (see SECURITY.md):
# no running as plain Node, no debug flags, no NODE_OPTIONS, and the app's code
# can't be swapped out after it's built.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch: universal # one download for Apple Silicon and Intel Macs
  # No paid Apple certificate: ad-hoc signed so it runs on Apple Silicon.
  # The Mac will warn once on first open; Read Me First explains the fix.
  identity: '-'
  hardenedRuntime: false
  artifactName: Contractor-CRM-${version}-mac.${ext}
  # The Mac app runs on Intel and Apple Silicon; the database has a file for each, used as-is.
  x64ArchFiles: '**/better-sqlite3-multiple-ciphers/prebuilds/darwin-*.node'

dmg:
  title: Contractor CRM
  background: build/background.png
  iconSize: 80
  window:
    width: 540
    height: 512 # background is 480 tall; the extra covers the window's title bar
  contents:
    - { x: 140, y: 140, type: file }
    - { x: 400, y: 140, type: link, path: /Applications }
    - { x: 270, y: 372, type: file, path: build/Read Me First.html }
  format: ULFO # newer Mac compression: smaller download, opens on macOS 10.11 and later

win:
  target:
    - target: nsis
      arch: x64
  artifactName: Contractor-CRM-${version}-windows-setup.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Contractor CRM

linux:
  target: AppImage
  category: Office
  artifactName: Contractor-CRM-${version}-linux.${ext}
